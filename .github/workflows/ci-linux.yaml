name: ci-linux

permissions:
  contents: read

defaults:
  run:
    shell: bash

on:
  pull_request:
  push:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep this job id: main's ruleset requires the "build" check.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test build checker failure handling
        run: |
          python3 scripts/ci/test_build_check.py
          python3 scripts/ci/test_z3_build.py
          node scripts/ci/test_nightly_report.cjs
      - name: Setup Lean and Z3 master
        run: bash scripts/ci/setup-tools.sh
      - name: Build and validate PlutusCore
        run: make check_plutus_core
      - name: Execute and validate tests
        run: LEAN_NUM_THREADS=5 ./scripts/check_lean_project_compilation.sh Tests Tests Tests/Conformance
      - name: Record tested environment
        if: always()
        run: python3 scripts/ci/record_environment.py
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-build-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  workflow-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate workflow definitions
        run: bash scripts/ci/lint-workflows.sh
