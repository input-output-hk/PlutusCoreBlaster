name: ci-linux

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [ staging, main ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  LEAN_VERSION: "4.24.0"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PlutusCoreBlaster

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: PlutusCoreBlaster
      - name: Setup Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "/home/runner/.elan/bin" >> $GITHUB_PATH
          chmod +x /home/runner/.elan/bin/*

      - name: Fix Elan version
        run: |
          elan toolchain install ${{ env.LEAN_VERSION }}
          elan default ${{ env.LEAN_VERSION }}

      - name: Resolve upstream Z3 revision
        id: z3
        run: |
          revision=$(git ls-remote https://github.com/Z3Prover/z3.git refs/heads/master | cut -f1)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
      - name: Restore Z3 build
        uses: actions/cache@v4
        id: z3-cache
        with:
          path: ${{ runner.temp }}/z3
          key: z3-${{ runner.os }}-${{ runner.arch }}-${{ steps.z3.outputs.sha }}
      - name: Build upstream Z3
        if: steps.z3-cache.outputs.cache-hit != 'true'
        env:
          Z3_REVISION: ${{ steps.z3.outputs.sha }}
        run: |
          git init "$RUNNER_TEMP/z3-src"
          git -C "$RUNNER_TEMP/z3-src" fetch --depth 1 https://github.com/Z3Prover/z3.git "$Z3_REVISION"
          git -C "$RUNNER_TEMP/z3-src" checkout --detach "$Z3_REVISION"
          cmake -S "$RUNNER_TEMP/z3-src" -B "$RUNNER_TEMP/z3-src/build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/z3" \
            -DZ3_BUILD_LIBZ3_SHARED=OFF -DZ3_BUILD_PYTHON_BINDINGS=OFF \
            -DZ3_BUILD_TEST_EXECUTABLES=OFF
          cmake --build "$RUNNER_TEMP/z3-src/build" --parallel 2
          cmake --install "$RUNNER_TEMP/z3-src/build"
      - name: Add Z3 to PATH
        run: echo "$RUNNER_TEMP/z3/bin" >> "$GITHUB_PATH"

      - name: Tools version
        run: |
          elan --version
          lake --version
          lean --version
          z3 --version

      - name: Build and Validate PlutusCore
        run: make check_plutus_core

      - name: Upload PlutusCore build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: plutus-core-build
          path: PlutusCoreBlaster/build.log

      - name: Execute and Validate Tests
        run: make check_tests

      - name: Upload Tests log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: tests-build
          path: PlutusCoreBlaster/build.log
